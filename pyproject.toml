[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_monitor"
version = "0.1.0"
description = "Adaptive Multi-Dimensional Monitoring (AMDM) for agentic AI systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
    "mutmut>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_monitor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["references/", ".venv/"]

[tool.ruff.lint]
# N803/N806: allow math-style capitalized locals/args (A, M_max, M2, F)
extend-ignore = ["N803", "N806"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.mutmut]
# F-013: mutation testing restricted to the critical Tier 1/Tier 2 math modules
# (user directive). All other modules are excluded — see MUTATION_NOTES.md.
source_paths = ["src"]
only_mutate = [
    "src/agent_monitor/joint.py",
    "src/agent_monitor/population.py",
    "src/agent_monitor/queue.py",
]
# --no-cov: neutralize the pytest-cov addopts + fail_under gate from
# [tool.pytest.ini_options]; otherwise partial per-mutant test runs fail the
# coverage threshold and every mutant is spuriously "killed".
pytest_add_cli_args = ["--no-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/agent_monitor --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agent_monitor"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]