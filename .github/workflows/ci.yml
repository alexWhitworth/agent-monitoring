name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so git diff / diff-cover can compare against origin/main
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest
      - name: Coverage of changed lines (diff-cover)
        # 1. Line-level coverage restricted to lines touched by this PR/branch.
        #    --fail-under=0 keeps this informational; raise it (e.g. 100) to
        #    enforce a diff-coverage gate. The overall 85% floor is still
        #    enforced by [tool.coverage.report] fail_under during the test run.
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=0 \
            --markdown-report=diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage of changed files
        # 2. File-level coverage of every src/agent_monitor .py file touched by
        #    this PR/branch (added, modified, or renamed; deleted files
        #    excluded). Scoped to the measured source tree -- tests/* is
        #    omitted from [tool.coverage.run], so including a test-only diff
        #    would match zero files and coverage report would hard-fail.
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/main...HEAD \
            | { grep '^src/agent_monitor/.*\.py$' || true; } | paste -sd, -)
          if [ -n "$CHANGED_FILES" ]; then
            uv run coverage report --include="$CHANGED_FILES" --fail-under=0
          else
            echo "No changed files within the measured source tree."
          fi
      - name: Overall library coverage
        # 3. Coverage of the entire src/agent_monitor package.
        run: uv run coverage report --fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint with ruff
        run: uv run ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Type-check with mypy
        run: uv run mypy src/
